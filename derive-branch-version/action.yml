name: 'Derive Branch Version'
description: >
  Derive a version number from the branch, its version declaration and the
  repository's release tags. Git-only — no Artifactory, no Jira, no controller
  config — so any workflow can use it, release-related or not.

inputs:
  branch-name:
    description: >
      Branch to derive for. Defaults to the ref the workflow runs on. On a pull
      request pass the BASE branch, so the version is the one the change would
      land as.
    required: false
    default: ''
  version-file:
    description: >
      Config declaring the release line, as MAJOR-VERSION= and MINOR-VERSION=
      lines. Hotfix branches take their version from the branch name and ignore
      it.
    required: false
    default: 'app-version.cfg'
  working-directory:
    description: 'Repository to inspect.'
    required: false
    default: '.'
  dev-label:
    description: >
      Label reserved for pull request builds. A Hotfix Line may not take it.
    required: false
    default: 'dev'

outputs:
  version:
    description: >
      The Build Tag for this commit, which is also the artifact version, e.g.
      27.1.31 on a release line or 27.1.30_hf.2 on a hotfix line. There is no
      separate target: a release is a second tag added later by promotion.
    value: ${{ steps.derive.outputs.version }}

runs:
  using: composite
  steps:
    - id: derive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
        BRANCH_NAME_IN: ${{ inputs.branch-name }}
        VERSION_FILE: ${{ inputs.version-file }}
        DEV_LABEL: ${{ inputs.dev-label }}
      run: |
        set -euo pipefail
        branchName="${BRANCH_NAME_IN:-${GITHUB_REF_NAME}}"
        chmod +x "$ACTION_PATH/../scripts/derive_branch_version.sh"
        "$ACTION_PATH/../scripts/derive_branch_version.sh" \
          "$branchName" "$VERSION_FILE" "." "$DEV_LABEL" | tee -a "$GITHUB_OUTPUT"
